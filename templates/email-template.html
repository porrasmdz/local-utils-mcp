<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">

    <title>$1</title>

    <!--[if gte mso 9]>
    <xml>
        <o:OfficeDocumentSettings>
            <o:AllowPNG/>
            <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style>
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-color: #f3f4f6;
        }

        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
            border-spacing: 0 !important;
            border-collapse: collapse !important;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            outline: none;
            text-decoration: none;
            display: block;
        }

        a {
            text-decoration: none;
        }

        .content-text,
        .content-text p,
        .content-text div {
            font-family: Arial, Helvetica, sans-serif;
            color: #4b5563;
            font-size: 16px;
            line-height: 1.7;
        }

        .content-text p {
            margin: 0 0 14px 0;
        }

        .links a {
            color: #5b21b6 !important;
            font-weight: 600;
        }

        @media screen and (max-width: 640px) {
            .email-container {
                width: 100% !important;
                max-width: 100% !important;
            }

            .card-padding {
                padding-left: 22px !important;
                padding-right: 22px !important;
            }

            .hero-image {
                max-width: 110px !important;
            }

            .main-title {
                font-size: 27px !important;
                line-height: 1.2 !important;
            }
        }
    </style>
</head>

<body width="100%" style="margin:0; padding:0 !important; background-color:#f3f4f6;">
<center role="article" aria-roledescription="email" lang="es" style="width:100%; background-color:#f3f4f6;">

    <!-- Preheader oculto -->
    <div style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
        $1
    </div>

    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
        <tr>
            <td align="center" style="padding:36px 12px;">

                <!--[if mso]>
                <table role="presentation" width="640" border="0" cellspacing="0" cellpadding="0">
                <tr>
                <td>
                <![endif]-->

                <table class="email-container" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                       style="max-width:640px; margin:0 auto; background-color:#ffffff; border-radius:18px; overflow:hidden; box-shadow:0 8px 28px rgba(17,24,39,0.08);">

                    <!-- Barra superior -->
                    <tr>
                        <td style="height:7px; background:#6d28d9; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>

                    <!-- Imagen / logo -->
                    <tr>
                        <td align="center" class="card-padding" style="padding:42px 40px 20px 40px;">
                            <img
                                src="$0"
                                alt=""
                                width="128"
                                class="hero-image"
                                style="width:128px; max-width:128px; height:auto; margin:0 auto;"
                            >
                        </td>
                    </tr>

                    <!-- Título -->
                    <tr>
                        <td align="center" class="card-padding" style="padding:4px 44px 12px 44px;">
                            <h1 class="main-title"
                                style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:32px; line-height:1.2; font-weight:700; letter-spacing:-0.5px; color:#111827;">
                                $1
                            </h1>
                        </td>
                    </tr>

                    <!-- Separador decorativo -->
                    <tr>
                        <td align="center" style="padding:8px 0 26px 0;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td width="44" height="4" style="width:44px; height:4px; background:#8b5cf6; border-radius:999px; font-size:0; line-height:0;">
                                        &nbsp;
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Cuerpo -->
                    <tr>
                        <td class="content-text card-padding"
                            style="padding:0 44px 12px 44px; font-family:Arial,Helvetica,sans-serif; color:#4b5563; font-size:16px; line-height:1.7;">
                            $2
                        </td>
                    </tr>

                    <!-- Links -->
                    <tr>
                        <td class="card-padding" style="padding:12px 44px 38px 44px;">
                            <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                                   style="background:#f8f7ff; border:1px solid #ede9fe; border-radius:12px;">
                                <tr>
                                    <td style="padding:20px 22px;">
                                        <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.2; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#7c3aed; margin-bottom:12px;">
                                            Enlaces
                                        </div>

                                        <!--
                                            $3 debe contener HTML con la lista de enlaces.

                                            Ejemplo:
                                            <ul style="margin:0; padding-left:20px;">
                                                <li style="margin:0 0 8px 0;">
                                                    <a href="https://ejemplo.com">Abrir documento</a>
                                                </li>
                                            </ul>
                                        -->
                                        <div class="links"
                                             style="font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.7; color:#374151;">
                                            $3
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background:#fafafa; border-top:1px solid #eeeeee; padding:20px 30px;">
                            <p style="margin:0; text-align:center; font-family:Arial,Helvetica,sans-serif; font-size:11px; line-height:1.6; color:#9ca3af;">
                                Este correo fue generado automáticamente por un asistente de inteligencia artificial.
                                Ante cualquier duda, contacta directamente al remitente.
                            </p>
                        </td>
                    </tr>

                </table>

                <!--[if mso]>
                </td>
                </tr>
                </table>
                <![endif]-->

            </td>
        </tr>
    </table>

</center>
</body>
</html>
